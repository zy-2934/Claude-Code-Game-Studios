# Workflow Catalog
# Used by /help to determine where a user is and what comes next.
#
# Artifact checks:
#   glob: file glob pattern — complete if ≥1 file matches (or min_count)
#   pattern: text pattern that must appear in the file (checked after glob)
#   min_count: minimum matching files required (default: 1)
#   note: human-readable fallback when completion can't be auto-detected
#
# repeatable: true → runs multiple times (one per system, story, etc.)
#
# ---------------------------------------------------------------------------
# required: — which project scales must complete this step
#
#   required: true              required at every scale
#   required: false             never required (optional enhancement)
#   required: [indie, studio]   required at those scales, optional at jam
#
# A list is truthy, so a reader that only tests truthiness still sees the
# studio behaviour. To resolve correctly, read production/scale.txt and check
# membership.
#
# ---------------------------------------------------------------------------
# Project scale — production/scale.txt, one word. Default: indie.
#
# This is ORTHOGONAL to production/review-mode.txt. Review mode controls WHO
# REVIEWS (which director gates spawn). Scale controls WHICH STEPS EXIST.
# They compose: scale=indie + review-mode=solo is a valid, very fast setup.
#
#   jam     Game jam / spike, under about a week. Validate by building, not by
#           documenting. No GDDs, no ADRs, no epics — use /quick-design for
#           anything needing a written rule. ~3 steps to first line of code.
#   indie   DEFAULT. Solo dev or small team shipping a real game. MVP-tier
#           GDDs, one architecture doc, one UX spec for the core HUD.
#           ~13 steps to first line of code.
#   studio  Team with specialists and handoffs between people who do not share
#           context. Every artifact, every gate. ~26 steps to first line of code.
#
# Choose by "who has to read this", not by ambition. A document exists so
# someone who was not in the room can act on it. Solo devs re-reading their own
# notes need far less than a team briefing an outsourcer.
#
# Scale is a floor, not a ceiling — any step can be run at any scale. Marking a
# step optional at jam means "not required", never "unavailable".
#
# ---------------------------------------------------------------------------
# Phase gates (/gate-check): verdicts are ADVISORY — they guide the decision
# but never hard-block advancement. The user always decides whether to proceed.
# Gates run by default per scale:
#   jam     none
#   indie   pre-production → production only
#   indie   ...plus polish → release if the game is being published
#   studio  all six

scales:
  default: indie
  values: [jam, indie, studio]
  config_file: production/scale.txt
  gates_by_scale:
    jam: []
    indie: [production, release]
    studio: [systems-design, technical-setup, pre-production, production, polish, release]

phases:

  concept:
    label: "Concept"
    description: "Develop your game idea into a documented concept"
    next_phase: systems-design
    steps:
      - id: brainstorm
        name: "Brainstorm"
        command: /brainstorm
        required: false
        description: "Explore the game concept using MDA, verb-first, and player psychology frameworks"

      - id: engine-setup
        name: "Engine Setup"
        command: /setup-engine
        required: true
        artifact:
          glob: ".claude/docs/technical-preferences.md"
          pattern: "Engine: [^[]"
        description: "Configure engine, pin version, set naming conventions and performance budgets"

      - id: game-concept
        name: "Game Concept Document"
        command: /brainstorm
        required: true
        artifact:
          glob: "design/gdd/game-concept.md"
        description: "Formalize concept with pillars, MDA analysis, and scope tiers"

      - id: design-review-concept
        name: "Concept Review"
        command: /design-review
        required: false
        description: "Validate the game concept (recommended before proceeding)"

      - id: art-bible
        name: "Art Bible"
        command: /art-bible
        required: false
        artifact:
          glob: "design/art/art-bible.md"
        description: "Author the visual identity specification (9 sections). Uses the Visual Identity Anchor produced by /brainstorm. Optional here — the Concept gate does not check it. Sections 1-4 are required by the Technical Setup gate and all 9 by the Pre-Production gate, so author it any time before then. Games using purchased or placeholder art can defer it until asset production actually starts."

      - id: prototype-concept
        name: "Concept Prototype"
        command: /prototype
        required: [jam]
        artifact:
          glob: "prototypes/*/REPORT.md"
          min_count: 1
        description: "Build a throwaway prototype to validate the core mechanic is fun before writing GDDs. Produces a PROCEED/PIVOT/KILL verdict. Recommended for first-time mechanics or high-risk design decisions; solo devs with proven concepts may skip."

      - id: map-systems
        name: "Systems Map"
        command: /map-systems
        required: [indie, studio]
        artifact:
          glob: "design/gdd/systems-index.md"
        description: "Decompose concept into systems with dependency ordering and priority tiers"

  systems-design:
    label: "Systems Design"
    description: "Author a GDD for each system in the systems index"
    next_phase: technical-setup
    steps:
      - id: design-system
        name: "System GDDs"
        command: /design-system
        required: [indie, studio]
        repeatable: true
        artifact:
          note: "Check design/gdd/systems-index.md — each MVP system needs Status: Approved"
        description: "Author per-system GDDs (guided, section-by-section). Run once per system."

      - id: quick-design
        name: "Quick Design Specs (jam scale)"
        command: /quick-design
        required: false
        repeatable: true
        artifact:
          glob: "design/quick-specs/*.md"
        description: "The jam-scale design path. Instead of a full GDD per system, write a short spec only for rules you would otherwise forget or get wrong — formulas, state machines, anything with a number in it. Skip it for mechanics that are obvious from the code. At indie and studio scale this stays what it is today: the lightweight path for changes too small to warrant /design-system."

      - id: design-review
        name: "Per-System Design Review"
        command: /design-review
        required: false
        repeatable: true
        description: "Validate a single GDD (8 required sections, no MAJOR REVISION verdict). No longer a separate required step: /design-system Phase 5c now runs this review automatically via an isolated subagent that re-reads the file from disk with no authoring context. Run this standalone when you want a second opinion at full depth, or to re-review after edits."

      - id: review-all-gdds
        name: "Cross-GDD Review"
        command: /review-all-gdds
        required: [indie, studio]
        artifact:
          glob: "design/gdd/gdd-cross-review-*.md"
        description: "Holistic consistency check + design theory review across all GDDs simultaneously. Subsumes /consistency-check — do not run both."

      - id: consistency-check
        name: "Consistency Check"
        command: /consistency-check
        required: false
        repeatable: true
        description: "Registry-anchored, grep-first scan for contradictions across GDDs. /review-all-gdds already covers this ground; use /consistency-check on its own only for a fast targeted re-check after a single GDD changes mid-project, when a full cross-review would be overkill."

  technical-setup:
    label: "Technical Setup"
    description: "Architecture decisions, visual identity specification, accessibility foundations, engine validation"
    next_phase: pre-production
    steps:
      - id: create-architecture
        name: "Architecture Document"
        command: /create-architecture
        required: [indie, studio]
        artifact:
          glob: "docs/architecture/architecture.md"
        description: "Author the master architecture document covering all systems"

      - id: architecture-decision
        name: "Architecture Decisions (ADRs)"
        command: /architecture-decision
        required: [studio]
        repeatable: true
        artifact:
          glob: "docs/architecture/adr-*.md"
          min_count: 3
        description: "Document key technical decisions as ADRs. Minimum 3 Foundation-layer ADRs required."

      - id: architecture-review
        name: "Architecture Review + Control Manifest"
        command: /architecture-review
        required: [indie, studio]
        artifact:
          glob: "docs/architecture/architecture-review-*.md"
        description: "Validate completeness, dependency ordering, engine compatibility — then generate docs/architecture/control-manifest.md in Phase 8b from the ADRs it just read. Re-run after each new ADR; it refreshes the manifest too."

      - id: control-manifest
        name: "Control Manifest"
        command: /create-control-manifest
        required: false
        artifact:
          glob: "docs/architecture/control-manifest.md"
        description: "Flat programmer rules sheet generated from all Accepted ADRs. Not a separate required step — /architecture-review Phase 8b produces it from the same ADR read. Use standalone to regenerate the manifest without a full review."

      - id: test-setup
        name: "Test Framework Setup"
        command: /test-setup
        required: [indie, studio]
        artifact:
          glob: "tests/**/*"
          note: "Check tests/unit/ and tests/integration/ exist plus .github/workflows/tests.yml"
        description: "Scaffold the test framework and CI pipeline. Required here, not in Pre-Production: the Technical Setup gate checks for tests/unit/, tests/integration/, .github/workflows/tests.yml and an example test. Leads to /test-helpers for fixtures, /qa-plan per epic, /smoke-check per sprint."

  pre-production:
    label: "Pre-Production"
    description: "Visual entity inventory, UX specs, asset specs, prototype the core mechanic, define stories, validate fun"
    next_phase: production
    steps:
      - id: entity-inventory
        name: "Visual Entity & Screen Inventory"
        command: /asset-spec
        required: false
        artifact:
          glob: "design/assets/entity-inventory.md"
        description: "Enumerate everything the game needs visually: entities (characters, enemies, buildings, environment pieces), UI screens, HUD elements, panels. Run /asset-spec with no arguments to start a collaborative inventory session — brief or detailed based on your responses. Reads GDDs and art bible to propose a starting list; you add, remove, and adjust. Becomes the source of truth for all art and UX work. Not required if the game has very few distinct visual elements."

      - id: asset-spec
        name: "Asset Specs"
        command: /asset-spec
        required: false
        repeatable: true
        artifact:
          glob: "design/assets/asset-manifest.md"
        description: "Generate per-asset visual specifications and AI generation prompts. Run once per entity, system, level, or character. If no source doc exists, /asset-spec interviews you inline — no narrative document required."

      - id: accessibility-doc
        name: "Accessibility Requirements"
        command: /ux-design
        required: [indie, studio]
        artifact:
          glob: "design/accessibility-requirements.md"
        description: "Commit accessibility tier (Basic/Standard/Comprehensive/Exemplary) and feature matrix. Written by /ux-design, which initializes this file and design/ux/interaction-patterns.md on first run. Author it before the key-screen specs — every UX spec is validated against this tier."

      - id: ux-design
        name: "UX Specs (key screens)"
        command: /ux-design
        required: [indie, studio]
        repeatable: true
        artifact:
          glob: "design/ux/*.md"
          min_count: 3
        description: "Author UX specs for the screens identified in the entity inventory (or GDDs if no inventory). Minimum required: main menu, core gameplay HUD, pause menu. Add more screens as the inventory identifies them. Reads input method and platform from technical-preferences.md."

      - id: ux-review
        name: "UX Review"
        command: /ux-review
        required: false
        description: "Validate key screen UX specs for GDD alignment and accessibility tier compliance. No longer a separate required step: /ux-design Phase 6b now reviews each spec via an isolated subagent as it is written. Run this standalone for a batch pass over all specs, or a second opinion at full depth."

      - id: create-epics
        name: "Create Epics + Stories"
        command: /create-epics
        required: [indie, studio]
        repeatable: true
        artifact:
          glob: "production/epics/*/EPIC.md"
          min_count: 1
        description: "Translate GDDs + ADRs into epics — one per architectural module — then continue into story breakdown in the same run (step 6 asks first). Run per layer: /create-epics layer: foundation, then /create-epics layer: core"

      - id: create-stories
        name: "Create Stories"
        command: /create-stories
        required: false
        repeatable: true
        artifact:
          glob: "production/epics/**/story-*.md"
          min_count: 2
        description: "Break a single epic into implementable story files. Not a separate required step — /create-epics step 6 offers to do this for every epic it just wrote, reusing the GDDs, ADRs and control manifest already loaded. Run standalone for one epic, or to re-break an epic after its GDD changed."

      - id: sprint-plan
        name: "First Sprint Plan"
        command: /sprint-plan
        required: [indie, studio]
        artifact:
          glob: "production/sprints/sprint-*.md"
          min_count: 1
        description: "Plan the first sprint with prioritized stories from epics"

      - id: vertical-slice
        name: "Vertical Slice"
        command: /vertical-slice
        required: false
        artifact:
          glob: "prototypes/*/REPORT.md"
          min_count: 1
        description: "Build and playtest a vertical slice — a complete end-to-end pass through the core loop. Recommended before committing epics and stories to production. Skipping is a valid solo dev call but increases risk of late-stage design pivots. If built, must be played and documented before advancing."

  production:
    label: "Production"
    description: "Sprint-based feature development — pick, implement, close stories"
    next_phase: polish
    steps:
      - id: sprint-plan
        name: "Sprint Plan"
        command: /sprint-plan
        required: [indie, studio]
        repeatable: true
        artifact:
          glob: "production/sprints/sprint-*.md"
        description: "Plan the current sprint with prioritized, ready stories. Includes the batch story-readiness pass (Phase 3b) — no need to run /story-readiness per story. Not required at jam scale: a jam that needs a sprint plan is not a jam."

      - id: story-readiness
        name: "Story Readiness Check"
        command: /story-readiness
        required: false
        description: "Validate a story is implementation-ready. Not a per-story step: /sprint-plan validates every story it admits to the sprint in one batch pass (it already spawns qa-lead for QL-STORY-READY). Use standalone when a story is added mid-sprint or revised after planning."

      - id: implement
        name: "Implement Stories"
        command: /dev-story
        required: true
        repeatable: true
        artifact:
          note: "Check src/ for active code and production/epics/**/*.md for In Progress stories"
        description: "Pick the next ready story and implement it with /dev-story [story-path]. Routes to the correct programmer agent."

      - id: code-review
        name: "Code Review"
        command: /code-review
        required: false
        repeatable: true
        description: "Architectural code review. Not a separate step in the story loop — /story-done Phase 5 performs the review (both spawn lead-programmer against the same diff, so running both reviewed every story twice). Use standalone for code not tied to a story, or for a mid-implementation check before /story-done."

      - id: story-done
        name: "Story Done Review"
        command: /story-done
        required: true
        repeatable: true
        description: "Verify all acceptance criteria, check GDD/ADR deviations, close the story"

      - id: qa-plan
        name: "QA Plan"
        command: /qa-plan
        required: false
        repeatable: true
        description: "Generate a QA test plan per epic or sprint. Run /qa-plan [epic-slug]. Produces test cases for /smoke-check, /regression-suite, and /test-evidence-review."

      - id: bug-report
        name: "Bug Report / Triage"
        command: /bug-report
        required: false
        repeatable: true
        description: "Log and prioritize bugs found during implementation. /bug-report creates a structured report; /bug-triage prioritizes the open backlog."

      - id: retrospective
        name: "Sprint Retrospective"
        command: /retrospective
        required: false
        repeatable: true
        description: "Post-sprint review to capture what worked and what to change. Run at the end of each sprint, before planning the next."

      - id: team-feature
        name: "Team Orchestration (optional)"
        required: false
        repeatable: true
        description: "Coordinate multiple agents on a complex feature. Use: /team-combat, /team-narrative, /team-ui, /team-audio, /team-level, /team-live-ops, /team-qa. Run when a feature spans multiple agent domains."

      - id: scope-check
        name: "Scope Check"
        command: /scope-check
        required: false
        repeatable: true
        artifact:
          glob: "production/sprints/sprint-*.md"
          note: "Run when stories are added mid-sprint, or before sprint retrospectives"
        description: "Detect scope creep by comparing current sprint scope to original epic scope. Run (a) when stories are added mid-sprint, or (b) before sprint retrospectives."

      - id: sprint-status
        name: "Sprint Status"
        command: /sprint-status
        required: false
        description: "Quick 30-line snapshot of sprint progress without a full report"

  polish:
    label: "Polish"
    description: "Performance, balance, playtesting, bug fixing"
    next_phase: release
    steps:
      - id: perf-profile
        name: "Performance Profile"
        command: /perf-profile
        required: false
        description: "Profile and optimize CPU/GPU/memory bottlenecks"

      - id: balance-check
        name: "Balance Check"
        command: /balance-check
        required: false
        description: "Analyze game balance formulas and data for outliers and broken progressions"

      - id: asset-audit
        name: "Asset Audit"
        command: /asset-audit
        required: false
        description: "Verify naming conventions, file format standards, and size budgets"

      - id: playtest-polish
        name: "Playtest Sessions (×3)"
        command: /playtest-report
        required: [indie, studio]
        artifact:
          glob: "production/playtests/*.md"
          min_count: 3
        description: "Cover: new player experience, mid-game systems, difficulty curve"

      - id: team-polish
        name: "Polish Team Pass"
        command: /team-polish
        required: [studio]
        description: "Coordinated polish pass across performance, audio, visual, and UX"

  release:
    label: "Release"
    description: "Launch preparation, certification, and ship"
    next_phase: null
    steps:
      - id: launch-checklist
        name: "Launch Checklist"
        command: /launch-checklist
        required: [indie, studio]
        description: "Full launch readiness across every department: code, content, store, marketing, community, infrastructure, legal, plus the Go/No-Go sign-off block. Last gate before shipping. Supersedes /release-checklist — do not run both."

      - id: release-checklist
        name: "Release Checklist"
        command: /release-checklist
        required: false
        description: "Build verification, certification and store metadata only. A strict subset of /launch-checklist (same 6-phase structure, fewer sections, no Go/No-Go block). Use for an interim release candidate or a patch build where the full launch sweep is overkill; for an actual launch run /launch-checklist instead."

      - id: changelog
        name: "Changelog + Patch Notes"
        command: /changelog
        required: false
        description: "Generate the internal changelog from commits, sprints and design docs — its final phase also emits the player-facing version, which is what /patch-notes produces. Run this alone unless you need patch notes without a changelog."

      - id: patch-notes
        name: "Patch Notes (standalone)"
        command: /patch-notes
        required: false
        description: "Player-facing notes only, from git history and sprint data. /changelog already emits a player-facing section, so running both duplicates the work — use this when you want the player notes without generating an internal changelog."
